<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
<title id="title">Target scoring</title><desc id="desc">Bullseye 50 points, inner ring 30, middle ring 20, outer ring 10. Target diameter 0.8 metres.</desc>
<rect width="960" height="320" rx="18" fill="#f2f5f8"/>
<circle cx="175" cy="153" r="122" fill="#222d38"/><circle cx="175" cy="153" r="97.6" fill="#428dc5"/><circle cx="175" cy="153" r="61" fill="#e06759"/><circle cx="175" cy="153" r="24.4" fill="#f2c553"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#1b2b3e">
<text x="355" y="56" font-size="28" font-weight="700">MAKE EVERY ARROW COUNT</text>
<g font-size="22">
<circle cx="365" cy="101" r="9" fill="#f2c553"/><text x="391" y="109">Bullseye</text><text x="738" y="109" font-weight="700">50 points</text>
<circle cx="365" cy="147" r="9" fill="#e06759"/><text x="391" y="155">Inner ring</text><text x="738" y="155" font-weight="700">30 points</text>
<circle cx="365" cy="193" r="9" fill="#428dc5"/><text x="391" y="201">Middle ring</text><text x="738" y="201" font-weight="700">20 points</text>
<circle cx="365" cy="239" r="9" fill="#222d38"/><text x="391" y="247">Outer ring</text><text x="738" y="247" font-weight="700">10 points</text>
</g>
<text x="100" y="298" font-size="16">0.8 m diameter</text><text x="355" y="290" font-size="16" fill="#526476">Miss / outside face / rear-face hit: 0 points</text>
</g></svg>
